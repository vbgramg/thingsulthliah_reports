name: Daily Mizoram VB-G RAM G Sync (Thingsulthliah Block)

on:
  schedule:
    # Runs at 00:25 UTC (5:55 AM IST) and 12:25 UTC (5:55 PM IST)
    - cron: '25 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  sync-reports:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper & Data Aggregator
        run: |
          python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/passbook.json data/emr_url_dates_cache.json data/wagelist_work_cache.json
          if [ -n "$(git status --porcelain data/)" ]; then
            git commit -m "Auto-sync Thingsulthliah report data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No data changes detected. Everything up to date."
          fi
